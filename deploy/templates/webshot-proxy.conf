proxy_pass http://webshot_backend;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Webshot-Client-IP $remote_addr;
proxy_set_header X-Webshot-Country $webshot_country;
proxy_buffering off;
proxy_read_timeout 60s;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
